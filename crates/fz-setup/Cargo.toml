[package]
name = "fz-setup"
description = "FerroZip installer and uninstaller"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "FerroZip-Setup"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "accesskit"] }
fz-shell = { path = "../fz-shell" }
rfd = "0.17.2"
zstd = "0.14.3"

[build-dependencies]
winresource = "0.1"
zstd = "0.14.3"
