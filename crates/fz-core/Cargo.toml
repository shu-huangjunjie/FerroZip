[package]
name = "fz-core"
description = "FerroZip archive engine: parallel ZIP/7z/TAR compression and extraction"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["rar"]
# RAR extraction uses the unRAR source, whose license forbids building a RAR
# compressor from it. Disable this feature for a strictly OSI-licensed build.
rar = ["dep:unrar"]

[dependencies]
aes = "0.9.3"
bzip2 = "0.6.1"
crc32fast = "1.5.3"
crossbeam-channel = "0.5.17"
ctr = "0.10.1"
encoding_rs = "0.8.42"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
getrandom = "0.4.3"
hmac = "0.13.0"
liblzma = { version = "0.4.9", features = ["parallel"] }
liblzma-sys = "0.4"
memmap2 = "0.9.12"
pbkdf2 = "0.13.0"
rayon = "1.12.0"
sevenz-rust2 = { version = "0.24.1", features = ["zstd", "deflate", "brotli", "lz4"] }
sha1 = "0.11.0"
sha2 = "0.11"
tar = "0.4.46"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["local-offset", "std"] }
unrar = { version = "0.5.8", optional = true }
windows-sys = { version = "0.61.2", features = ["Win32_Globalization", "Win32_Storage_FileSystem", "Win32_Foundation", "Win32_System_SystemInformation"] }
zip = { version = "9.0.5", default-features = false, features = ["aes-crypto", "bzip2", "deflate64", "deflate-flate2-zlib-rs", "lzma", "zstd", "xz", "time"] }
zstd = { version = "0.14.3", features = ["zstdmt"] }

[dev-dependencies]
tempfile = "3"
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Win32_Security"] }

[build-dependencies]
cc = "1.10.0"
